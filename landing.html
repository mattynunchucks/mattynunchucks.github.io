<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>mattynunchucks.com</title>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        background: #080c14;
        color: #c8d8f0;
        font-family: sans-serif;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 2rem;
      }
      h1 { font-size: 1.8rem; letter-spacing: 0.08em; color: #7ad4ff; }
      a.game-link {
        display: inline-block;
        padding: 14px 36px;
        background: #1a2a44;
        border: 1px solid #3a6a9a;
        border-radius: 6px;
        color: #7ad4ff;
        text-decoration: none;
        font-size: 1.1rem;
        letter-spacing: 0.06em;
        transition: background 0.15s, border-color 0.15s;
      }
      a.game-link:hover {
        background: #223655;
        border-color: #7ad4ff;
      }
    </style>
  </head>
  <body>
    <h1>mattynunchucks.com</h1>
    <a class="game-link" href="/cosmogenesis/">CosmoGenesis</a>
    <a class="game-link" href="/xenominer/">XenoMiner</a>
  </body>
</html>
